name: Release

# workflow_dispatch is the recovery path for the rare push event GitHub drops
# (main merge 75055e6 produced no run); the tag action re-derives the version
# from commits since the last tag, so a manual run publishes exactly what the
# lost run would have.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Queue, never cancel: a run that merges a release PR must finish publishing
# its version tags even if another push lands mid-build.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm fmt:check
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      # Bumps from the conventional commit subjects since the last tag:
      # fix → patch, feat → minor, BREAKING CHANGE/! → major. With
      # default_bump: false, chore/docs/ci merges create no tag and the
      # publish job ships only a sha image without moving `latest`.
      - id: tag
        uses: mathieudutour/github-tag-action@a22cf08638b34d5badda920f9daf6e72c477b07b # v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
      - if: steps.tag.outputs.new_tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
  publish:
    needs: [verify, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # QEMU emulates the non-native arch for the linux/arm64 leg below.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Every main push gets an immutable sha tag; version tags and
          # `latest` move only when the release job cut a tag. Tags created
          # via GITHUB_TOKEN don't trigger workflows, so the versioned
          # publish must chain off the release job's outputs here instead
          # of an `on: push: tags` trigger.
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ startsWith(needs.release.outputs.new_tag, 'v') }}
            type=semver,pattern={{version}},value=${{ needs.release.outputs.new_tag }},enable=${{ startsWith(needs.release.outputs.new_tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.new_tag }},enable=${{ startsWith(needs.release.outputs.new_tag, 'v') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
